[project]
name = "rlzilatran"
version = "0.0.0"
description = "Project applying Reinforcement Learning Approaches to Zilatran Chess."
authors = [
    {name = "Christof Stein",email = "christof.stein@student.uibk.ac.at"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch (>=2.6.0,<3.0.0)",
    "tk (>=0.1.0,<0.2.0)",
    "numpy (>=2.2.5,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "torchtyping (>=0.1.5,<0.2.0)",
    "dynaconf (>=3.2.11,<4.0.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "toml (>=0.10.2,<0.11.0)",
    "click (>=8.2.1,<9.0.0)"
]

[tool.poetry.group.mpi.dependencies]
mpi4py = ">=4.0.3,<5.0.0"

[tool.poetry.group.mpi]
optional = true

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "tests",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
pytest = "^8.3.5"
pre-commit = "^4.2.0"
coverage = "^7.8.0"
pydeps = "^3.0.1"
