[project]
name = "rlzilatran"
version = "0.0.0"
description = "Project applying Reinforcement Learning Approaches to Zilatran Chess."
authors = [
    {name = "Christof Stein",email = "christof.stein@student.uibk.ac.at"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest (>=8.3.5,<9.0.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "torch (>=2.6.0,<3.0.0)",
    "tk (>=0.1.0,<0.2.0)",
    "numpy (>=2.2.5,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = "src"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
