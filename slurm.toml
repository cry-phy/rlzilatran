[general]
hostname             = "login.leo5"
mode                 = "prod"
queue                = "std"
conda_env            = "rlzilatran"
gpus_per_node        = 2      # GPUs per node
cpus_per_node        = 64     # CPUs per node (used for scheduling if needed)

[prod]
time                 = "01:00:00"
worker_cpus_total    = 640    # total CPU worker processes across all nodes

[prod.gpu]
training_processes   = 1      # defaults to gpus_per_node if omitted
inference_processes  = 4

[prod.gpu.training]
threads_per_gpu      = 4
mem_per_process      = 4000

[prod.gpu.inference]
threads_per_gpu      = 4
mem_per_process      = 4000

[prod.cpu]
threads_per_process  = 1
mem_per_process      = 1000
agents_per_observer  = 1

[dev]
time                 = "00:01:00"
worker_cpus_total    = 4      # smaller total for dev
